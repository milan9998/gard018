services:
  app:
    image: gard018-app:local
    ports:
      - "3000:3000"
    environment:
      # Resolve links from the incoming host so localhost, Quick Tunnel and
      # test domains all work without rebuilding the configuration by hand.
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-auto}

  scheduler:
    image: gard018-app:local

  caddy:
    profiles:
      - production
